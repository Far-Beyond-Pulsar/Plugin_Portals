[package]
name = "portals_plugin"
version = "0.1.0"
edition = "2024"
publish = false
description = "Portals (`pulsar.portals`): the plugin's root crate, the one place it registers everything it contributes (runtime registrations always, the editor's with `editor`)"
# `examples/` is the plugin's examples crate, not this package's examples.
autoexamples = false

[features]
# The editor's registrations (the viewport's portal links overlay) and the
# crates they need. A game links the root without it, so it takes no editor
# dependency.
editor = ["dep:portals_editor", "dep:ui_level_editor"]

[dependencies]
# The plugin gate and the builder its registrations go through.
pulsar_plugins = { workspace = true }
# The plugin's crates.
portals_component = { workspace = true }
portals_editor = { workspace = true, optional = true }
helio-pass-portal-cull = { workspace = true }
# The engine seams the plugin registers into.
engine_backend = { path = "../../../crates/core/engine_backend", default-features = false, features = ["render"] }
pulsar_settings = { workspace = true }
pulsar_world_registry = { workspace = true }
# The editor's extension points.
ui_level_editor = { workspace = true, optional = true }

[dev-dependencies]
# The plugin's integration tests (`tests/`): the plugin as a game links it.
glam = { workspace = true }
helio-core = { workspace = true }
pulsar_scene_model = { workspace = true }
pulsar_scenedb = { workspace = true }
helio = { workspace = true }
helio-graph-asset = { workspace = true }
helio-presets = { workspace = true }
pollster = "=0.4.0"
# The render graph node test (`tests/graph_node.rs`) makes its own device.
wgpu = { workspace = true }

[lints]
workspace = true
