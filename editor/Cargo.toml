[package]
name = "portals_editor"
version = "0.1.0"
edition = "2024"
description = "Portals (pulsar.portals): the editor crate -- the viewport's portal diagnostics overlay, over the plugin's component crate"

[lib]
name = "portals_editor"

[dependencies]
portals_component = { workspace = true }
# The level editor UI the root registers through its extension points
# (`ui_level_editor::extend`).
ui_level_editor = { workspace = true }
gpui-ce = { workspace = true }
ui = { workspace = true }
engine_backend = { workspace = true }
glam = { workspace = true }
pulsar_scenedb = { workspace = true }

[lints]
workspace = true
