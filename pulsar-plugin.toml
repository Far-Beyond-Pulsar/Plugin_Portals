# The `pulsar.portals` plugin's descriptor. A project enables or disables it in
# its Pulsar.toml (`[plugins]`); disabled, its kind is absent (see
# crates/core/pulsar_plugins). Its root crate carries this file
# (`pulsar_plugins::installed!`).
id = "pulsar.portals"
name = "Portals"
description = "Openings that show another place: their component, pairing and projection, settings, and the renderer feature that draws what each opening shows as an inline view of the frame"
enabled_by_default = true
# What a portal shows is an inline view of the frame (helio_core::view): the
# openings travel as a frame payload, every drawer draws through them with
# its own program, and the plugin reads no other kind's rows.
provides = []
requires = []

# The plugin's root crate (the package in this directory): the one place it
# registers everything it contributes. A game links it without its `editor`
# feature; the editor links it with.
root = "portals_plugin"
