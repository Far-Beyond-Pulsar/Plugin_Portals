# The `pulsar.portals` plugin's descriptor. A project enables or disables it in
# its Pulsar.toml (`[plugins]`); disabled, its kind is absent (see
# crates/core/pulsar_plugins). Its root crate carries this file
# (`pulsar_plugins::installed!`).
id = "pulsar.portals"
name = "Portals"
description = "Openings that show another place: their component, pairing and projection, settings, and the renderer feature that publishes the chains every drawer draws its content through"
enabled_by_default = true
# What a portal shows is drawn into the frame's own G-buffer as more
# occurrences of each drawer's content, through the chains the plugin
# publishes (helio-portal-api); other kinds read portal concepts from that
# api crate only.
provides = [
    { id = "pulsar.portals.api", kind = "api", members = ["helio-portal-api"], version = 1 },
]
requires = []

# The plugin's root crate (the package in this directory): the one place it
# registers everything it contributes. A game links it without its `editor`
# feature; the editor links it with.
root = "portals_plugin"
