[package]
name = "helio-portal-api"
version = "0.1.0"
edition = "2021"
description = "The portals' public contract: the frame's portal chains (what a host publishes, the GPU rows the portals' chains pass uploads), the aperture mask, the draw orders around them, and the WGSL a drawer includes to draw its content through a chain. The one crate another kind reads a portal concept from."
license = "MIT OR Apache-2.0"

[dependencies]
bytemuck = { workspace = true, features = ["derive"] }
glam = { workspace = true }
helio-core = { workspace = true }
helio-frame-api = { workspace = true }
wgpu = { workspace = true }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
