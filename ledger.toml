# The portals plugin's rows of the SceneDB closure ledger (Pulsar-Native#1035):
# its classes, GPU schemas, buffers, pass crates and call sites. A plugin owns
# the rows of what it ships (Pulsar-Native#1606); `cargo test -p scene_inventory`
# in a Pulsar-Native checkout recomputes every fact column, checks the human
# columns, and fails on a missing, stale or misplaced row. The columns are
# described in Pulsar-Native's crates/core/scene_inventory/ledger.toml.

# ── Exposed component classes ───────────────────────────────────

[[class]]
name = "PortalComponent"
category = "Rendering"
world_registered = true
own_gpu_columns = false
owner = "portals_component::component"
disposition = "keep: finished in Phase B (pulsar.portals): two portals with the same non-zero link_id are a pair, and the portals' join projects them; no longer declared unfinished"
target_contract = "Phase B; plugin-migration.md"
test = "plugins/installed/tests/render_acceptance.rs (linked_portals_show_the_far_side_in_the_frame)"
status = "verified"

# ── Render pass crates ──────────────────────────────────────────
# No GPU buffer keys: the chains are a frame payload (PORTAL_CHAIN_SET), and
# the chains pass uploads its own rows (helio_portal_api).

[[pass]]
crate = "helio-pass-portal-cull"
in_default_graph = false
reads = []
owner = "pulsar.portals (the CPU projection of authored portals, the chains it publishes, the settings)"
disposition = "keep: holds no pass; publishes every opening and route to the configured depth (PORTAL_CHAIN_SET, p25b, Helio#390)"
target_contract = "p25b; plugin-migration.md (As built, p25b)"
test = "plugins/vendor/portals/tests/projection.rs (a_pair_publishes_its_chains_and_takes_no_table_slot)"
status = "verified"

[[pass]]
crate = "helio-pass-portal-instances"
in_default_graph = false
reads = []
owner = "pulsar.portals (PortalChainsPass, PortalMaskPass: the live chains every drawer draws through, the aperture mask)"
disposition = "keep: the chains (scene prep) and the mask (G-buffer order 60); every drawer emits its own occurrences through the chains (Helio#390)"
target_contract = "p25b; plugin-migration.md (As built, p25b)"
test = "plugins/installed/tests/render_acceptance.rs (linked_portals_show_the_far_side_in_the_frame, a_portal_shows_the_decals_of_the_far_side)"
status = "verified"
