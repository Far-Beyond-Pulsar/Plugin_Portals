[package]
name = "helio-pass-portal-instances"
version = "0.1.0"
edition = "2021"
description = "What each portal shows: an inline view of the frame through its opening, drawn by every G-buffer drawer (recursive), and the editor overlay on the openings"

[features]
default = ["gpu"]
gpu = []

[dependencies]
helio-frame-api = { workspace = true }
helio-feature-api = { workspace = true }
helio-core = { workspace = true }
helio-pass-portal-cull = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
glam = { workspace = true }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
